<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMANA — Sugestões de Agentes IA · Unimed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap');

:root {
  --navy: #2b296b;
  --teal: #2bbcb6;
  --blue: #2c479e;
  --sky: #58c9f4;
  --aqua: #028c8e;
  --pink: #ef5ba1;
  --lavender: #6167af;
  --warm-gray: #f0edeb;
  --light: #f7f5f3;
  --gray: #3c3c3c;
  --mid-gray: #8a8a8a;
  --white: #ffffff;
  --unimed-green: #00995D;
  --font: 'Titillium Web', sans-serif;
  --radius: 12px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--warm-gray);
  color: var(--navy);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.header {
  background: var(--navy);
  padding: 28px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.header-logo { height: 24px; }

.header-divider {
  width: 1px;
  height: 24px;
  background: rgba(255,255,255,0.15);
}

.header h1 {
  font-weight: 700;
  font-size: 16px;
  color: var(--white);
  letter-spacing: 0.5px;
}

.header h1 span {
  font-weight: 300;
  color: rgba(255,255,255,0.5);
}

.header h1 .sistema-unimed {
  color: var(--unimed-green);
  font-weight: 600;
}

/* ===== HEADER CTA ===== */
.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.cta-header {
  font-family: var(--font);
  font-weight: 700;
  font-size: 14px;
  color: var(--white);
  background: linear-gradient(135deg, var(--teal) 0%, var(--aqua) 100%);
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(43, 188, 182, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  white-space: nowrap;
}

.cta-header:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(43, 188, 182, 0.5);
}

.cta-header:active {
  transform: translateY(0);
}

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(43, 41, 107, 0.6);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.modal-backdrop.open {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--white);
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  padding: 36px;
  position: relative;
  box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-size: 20px;
  color: var(--mid-gray);
  cursor: pointer;
  transition: background 0.2s;
}

.modal-close:hover {
  background: var(--warm-gray);
  color: var(--navy);
}

.modal h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
}

.modal p {
  font-size: 14px;
  color: var(--mid-gray);
  margin-bottom: 24px;
  line-height: 1.5;
}

.form-field {
  margin-bottom: 14px;
}

.form-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--gray);
  margin-bottom: 6px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.form-field input {
  font-family: var(--font);
  font-size: 14px;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 10px;
  background: var(--light);
  color: var(--navy);
  outline: none;
  transition: border-color 0.2s;
}

.form-field input:focus {
  border-color: var(--teal);
  background: var(--white);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.modal-submit {
  font-family: var(--font);
  font-weight: 700;
  font-size: 15px;
  color: var(--white);
  background: linear-gradient(135deg, var(--teal) 0%, var(--aqua) 100%);
  border: none;
  padding: 14px 20px;
  border-radius: 10px;
  cursor: pointer;
  width: 100%;
  margin-top: 10px;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(43, 188, 182, 0.35);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.modal-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(43, 188, 182, 0.5);
}

.modal-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.modal-feedback {
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
  color: var(--aqua);
  display: none;
}

.modal-feedback.show {
  display: block;
}

.modal-feedback.error {
  color: var(--pink);
}

@media (max-width: 768px) {
  .header { flex-direction: column; gap: 16px; align-items: flex-start; }
  .header-right { width: 100%; justify-content: flex-end; }
  .cta-header { padding: 10px 16px; font-size: 13px; }
  .form-row { grid-template-columns: 1fr; }
  .modal { padding: 28px 22px; }
}

/* ===== TOOLBAR ===== */
.toolbar {
  background: var(--white);
  padding: 20px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  position: sticky;
  top: 80px;
  z-index: 99;
  flex-wrap: wrap;
}

.view-toggle {
  display: flex;
  background: var(--warm-gray);
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
}

.view-btn {
  font-family: var(--font);
  font-weight: 600;
  font-size: 13px;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.25s ease;
  color: var(--mid-gray);
  background: transparent;
  white-space: nowrap;
}

.view-btn.active {
  background: var(--navy);
  color: var(--white);
  box-shadow: var(--shadow-sm);
}

.view-btn:not(.active):hover {
  color: var(--navy);
  background: rgba(43,41,107,0.06);
}

.stats {
  display: flex;
  gap: 24px;
  align-items: center;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gray);
}

.stat-pill .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-p { background: var(--teal); }
.dot-m { background: var(--blue); }
.dot-g { background: var(--navy); }

/* ===== SEARCH ===== */
.search-box {
  position: relative;
}

.search-box input {
  font-family: var(--font);
  font-size: 14px;
  padding: 10px 16px 10px 40px;
  border: 1.5px solid rgba(0,0,0,0.08);
  border-radius: 10px;
  background: var(--light);
  color: var(--navy);
  width: 260px;
  transition: border-color 0.2s;
  outline: none;
}

.search-box input:focus {
  border-color: var(--teal);
}

.search-box::before {
  content: '⌕';
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--mid-gray);
}

/* ===== MAIN ===== */
.main {
  padding: 32px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .header, .toolbar, .main { padding-left: 16px; padding-right: 16px; }
  .search-box input { width: 100%; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .stats { justify-content: center; }
}

/* ===== GROUP ===== */
.group {
  margin-bottom: 40px;
}

.group-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(0,0,0,0.06);
}

.group-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  color: var(--white);
  flex-shrink: 0;
}

.group-header h2 {
  font-weight: 700;
  font-size: 20px;
  color: var(--navy);
  flex: 1;
}

.group-count {
  font-weight: 600;
  font-size: 12px;
  color: var(--mid-gray);
  background: var(--warm-gray);
  padding: 4px 12px;
  border-radius: 20px;
}

/* ===== CARD GRID ===== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

@media (max-width: 768px) {
  .card-grid { grid-template-columns: 1fr; }
}

/* ===== AGENT CARD ===== */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 22px 22px 18px;
  border: 1.5px solid transparent;
  transition: all 0.2s ease;
  cursor: default;
  position: relative;
}

.card:hover {
  border-color: rgba(43,188,182,0.3);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.card h3 {
  font-weight: 700;
  font-size: 15px;
  color: var(--navy);
  line-height: 1.3;
  flex: 1;
}

/* Complexity badge */
.complexity-badge {
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.cb-pronto {
  background: rgba(43,188,182,0.12);
  color: var(--aqua);
}

.cb-customizado {
  background: rgba(44,71,158,0.1);
  color: var(--blue);
}

.cb-desenvolvimento {
  background: rgba(43,41,107,0.08);
  color: var(--navy);
}

/* Area badge (shown in complexity view) */
.area-badge {
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--mid-gray);
  margin-bottom: 8px;
}

.card-desc {
  font-weight: 300;
  font-size: 13px;
  color: var(--gray);
  line-height: 1.6;
  margin-bottom: 12px;
}

.card-impact {
  font-weight: 600;
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 6px;
  display: inline-block;
  background: var(--light);
  color: var(--aqua);
}

/* Left accent stripe */
.card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 3px;
  border-radius: 0 3px 3px 0;
}

.card.t-pronto::before { background: var(--teal); }
.card.t-customizado::before { background: var(--blue); }
.card.t-desenvolvimento::before { background: var(--navy); }

/* ===== LEGEND ===== */
.legend {
  background: var(--white);
  border-radius: var(--radius);
  padding: 20px 28px;
  margin-bottom: 32px;
  display: flex;
  gap: 32px;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: var(--shadow-sm);
}

.legend-title {
  font-weight: 700;
  font-size: 13px;
  color: var(--navy);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 400;
  color: var(--gray);
}

.legend-swatch {
  width: 24px;
  height: 8px;
  border-radius: 4px;
}

.ls-pronto { background: var(--teal); }
.ls-customizado { background: var(--blue); }
.ls-desenvolvimento { background: var(--navy); }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--mid-gray);
}

.empty-state .emoji { font-size: 48px; margin-bottom: 16px; }
.empty-state h3 { font-weight: 600; font-size: 18px; margin-bottom: 8px; color: var(--navy); }
.empty-state p { font-weight: 300; font-size: 14px; }

/* ===== ANIMATION ===== */
.group { animation: fadeUp 0.35s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

const AREA_COLORS = {
  "B1": "#ef5ba1",
  "B2": "#2c479e",
  "B3": "#6167af",
  "B4": "#028c8e",
  "B5": "#2bbcb6",
  "B6": "#58c9f4",
  "B7": "#2b296b",
  "B8": "#e8734a",
};

const AREA_ORDER = ["B1","B2","B3","B4","B5","B6","B7","B8"];
const TIER_ORDER = ["pronto","customizado","desenvolvimento"];
const TIER_LABELS = { pronto: "Pronto", customizado: "Customizado", desenvolvimento: "Desenvolvimento" };
const TIER_COLORS = { pronto: "var(--teal)", customizado: "var(--blue)", desenvolvimento: "var(--navy)" };

let currentView = 'area';

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

function getFilteredAgents() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) return AGENTS;
  return AGENTS.filter(a =>
    a.name.toLowerCase().includes(q) ||
    a.area.toLowerCase().includes(q) ||
    a.desc.toLowerCase().includes(q) ||
    a.impact.toLowerCase().includes(q) ||
    TIER_LABELS[a.tier].toLowerCase().includes(q)
  );
}

function makeCard(agent) {
  const tierClass = `t-${agent.tier}`;
  const cbClass = `cb-${agent.tier}`;
  const areaLabel = currentView === 'complexidade'
    ? `<div class="area-badge">${agent.areaCode} · ${agent.area}</div>`
    : '';
  const tierBadge = `<span class="complexity-badge ${cbClass}">${TIER_LABELS[agent.tier]}</span>`;
  return `
    <div class="card ${tierClass}">
      ${areaLabel}
      <div class="card-top">
        <h3>${agent.name}</h3>
        ${tierBadge}
      </div>
      <div class="card-desc">${agent.desc}</div>
      <div class="card-impact">${agent.impact}</div>
    </div>
  `;
}

function renderCards() {
  const agents = getFilteredAgents();
  const container = document.getElementById('mainContent');
  const all = getFilteredAgents();
  document.getElementById('countP').textContent = all.filter(a=>a.tier==='pronto').length;
  document.getElementById('countM').textContent = all.filter(a=>a.tier==='customizado').length;
  document.getElementById('countG').textContent = all.filter(a=>a.tier==='desenvolvimento').length;

  if (agents.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🔍</div>
        <h3>Nenhum agente encontrado</h3>
        <p>Tente outro termo de busca.</p>
      </div>`;
    return;
  }

  let html = `
    <div class="legend">
      <span class="legend-title">Complexidade:</span>
      <div class="legend-item"><span class="legend-swatch ls-pronto"></span> Pronto — usuário opera sozinho na plataforma</div>
      <div class="legend-item"><span class="legend-swatch ls-customizado"></span> Customizado — configurado pela Aimana para a sua área</div>
      <div class="legend-item"><span class="legend-swatch ls-desenvolvimento"></span> Desenvolvimento — projeto com integração e arquitetura dedicada</div>
    </div>
  `;

  if (currentView === 'area') {
    const grouped = {};
    agents.forEach(a => {
      const key = a.areaCode;
      if (!grouped[key]) grouped[key] = { area: a.area, code: a.areaCode, agents: [] };
      grouped[key].agents.push(a);
    });
    AREA_ORDER.forEach(code => {
      if (!grouped[code]) return;
      const g = grouped[code];
      g.agents.sort((a,b) => TIER_ORDER.indexOf(a.tier) - TIER_ORDER.indexOf(b.tier));
      const color = AREA_COLORS[code];
      html += `
        <div class="group">
          <div class="group-header">
            <div class="group-icon" style="background:${color}">${code}</div>
            <h2>${g.area}</h2>
            <span class="group-count">${g.agents.length} agente${g.agents.length>1?'s':''}</span>
          </div>
          <div class="card-grid">
            ${g.agents.map(makeCard).join('')}
          </div>
        </div>
      `;
    });
  } else {
    TIER_ORDER.forEach(tier => {
      const group = agents.filter(a => a.tier === tier);
      if (group.length === 0) return;
      group.sort((a,b) => AREA_ORDER.indexOf(a.areaCode) - AREA_ORDER.indexOf(b.areaCode));
      const color = TIER_COLORS[tier];
      const label = TIER_LABELS[tier];
      const descriptions = {
        pronto: "Rodam na plataforma Aimana com autonomia total do colaborador",
        customizado: "Configurado pela Aimana com regras e dados da sua cooperativa",
        desenvolvimento: "Projeto com integração profunda, arquitetura dedicada e ROI direto",
      };
      html += `
        <div class="group">
          <div class="group-header">
            <div class="group-icon" style="background:${color}">${group.length}</div>
            <h2>${label} <span style="font-weight:300;font-size:14px;color:var(--mid-gray);margin-left:8px">${descriptions[tier]}</span></h2>
          </div>
          <div class="card-grid">
            ${group.map(makeCard).join('')}
          </div>
        </div>
      `;
    });
  }
  container.innerHTML = html;
}

renderCards();
</script>

<!-- ===== CONTACT MODAL ===== -->
<div class="modal-backdrop" id="contactModal" onclick="handleBackdropClick(event)">
  <div class="modal" role="dialog" aria-labelledby="modalTitle">
    <button class="modal-close" onclick="closeContactModal()" aria-label="Fechar">×</button>
    <h2 id="modalTitle">Fale com nosso time</h2>
    <p>Preencha seus dados e agende uma reunião com o time AIMANA.</p>
    <form id="contactForm" onsubmit="handleContactSubmit(event)">
      <div class="form-field">
        <label for="f-name">Nome</label>
        <input type="text" id="f-name" name="name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label for="f-email">E-mail corporativo</label>
        <input type="email" id="f-email" name="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label for="f-phone">Telefone</label>
        <input type="tel" id="f-phone" name="phone" required autocomplete="tel" placeholder="(00) 00000-0000">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label for="f-company">Empresa</label>
          <input type="text" id="f-company" name="company" required autocomplete="organization">
        </div>
        <div class="form-field">
          <label for="f-role">Cargo</label>
          <input type="text" id="f-role" name="role" required autocomplete="organization-title">
        </div>
      </div>
      <button type="submit" class="modal-submit" id="contactSubmitBtn">Agendar reunião</button>
      <div class="modal-feedback" id="contactFeedback"></div>
    </form>
  </div>
</div>

<script>
// TODO: substituir pela URL real do webhook (HubSpot / Zapier / Make / etc.)
const CONTACT_WEBHOOK_URL = 'WEBHOOK_URL_AQUI';
const CALENDLY_URL = 'https://calendly.com/lucas-aimana/1h';

function openContactModal() {
  document.getElementById('contactModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function closeContactModal() {
  document.getElementById('contactModal').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('contactFeedback').classList.remove('show', 'error');
}

function handleBackdropClick(e) {
  if (e.target.id === 'contactModal') closeContactModal();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeContactModal();
});

async function handleContactSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('contactSubmitBtn');
  const feedback = document.getElementById('contactFeedback');
  const data = {
    name:    document.getElementById('f-name').value.trim(),
    email:   document.getElementById('f-email').value.trim(),
    phone:   document.getElementById('f-phone').value.trim(),
    company: document.getElementById('f-company').value.trim(),
    role:    document.getElementById('f-role').value.trim(),
    source:  'lp.aimana.ai/agentes_unimed',
    timestamp: new Date().toISOString()
  };

  btn.disabled = true;
  btn.textContent = 'Enviando...';
  feedback.classList.remove('show', 'error');

  try {
    if (CONTACT_WEBHOOK_URL && CONTACT_WEBHOOK_URL !== 'WEBHOOK_URL_AQUI') {
      await fetch(CONTACT_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        mode: 'no-cors'
      });
    } else {
      console.warn('[AIMANA] Webhook não configurado. Dados do formulário:', data);
    }

    feedback.textContent = 'Cadastro enviado! Redirecionando para o Calendly...';
    feedback.classList.add('show');
    btn.textContent = 'Agendar reunião';

    // Pré-preenche e abre o Calendly em nova aba
    const calendlyWithParams = `${CALENDLY_URL}?name=${encodeURIComponent(data.name)}&email=${encodeURIComponent(data.email)}&a1=${encodeURIComponent(data.company + ' — ' + data.role)}`;
    setTimeout(() => {
      window.open(calendlyWithParams, '_blank', 'noopener');
      closeContactModal();
      document.getElementById('contactForm').reset();
      btn.disabled = false;
    }, 800);

  } catch (err) {
    console.error('[AIMANA] Erro no envio:', err);
    feedback.textContent = 'Não foi possível enviar agora. Tente novamente em instantes.';
    feedback.classList.add('show', 'error');
    btn.disabled = false;
    btn.textContent = 'Agendar reunião';
  }
}
</script>
